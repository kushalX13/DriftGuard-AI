# Publish the latest DriftGuard report to GitHub Pages (stable CV demo link).
# Enable Pages in repo Settings → Pages → Source: GitHub Actions.
# On push to main: run pipeline, convert report.md → HTML, deploy to Pages.

name: Pages

on:
  push:
    branches: [main, master]

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TF_INPUT: "0"
  FAIL_ON: "none"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Conftest
        run: |
          CONFTEST_VERSION="0.49.0"
          ARCH=$(uname -m)
          SYS=$(uname -s)
          URL="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_${SYS}_${ARCH}.tar.gz"
          curl -sSfL "$URL" | tar xz
          chmod +x conftest
          sudo mv conftest /usr/local/bin/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend=false

      - name: Generate tfplan.json
        id: plan
        working-directory: infra
        run: |
          set -euo pipefail
          if terraform plan -out=tfplan -no-color; then
            terraform show -json tfplan > tfplan.json
          else
            cp ../policies/examples/sample_plan.json tfplan.json
          fi
          echo "plan_path=infra/tfplan.json" >> "$GITHUB_OUTPUT"

      - name: Run DriftGuard pipeline
        run: python -m scripts.cli run --plan "${{ steps.plan.outputs.plan_path }}" --fail-on "${{ env.FAIL_ON }}"

      - name: Convert report to HTML
        run: python -m scripts.md_to_html reports/report.md .pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

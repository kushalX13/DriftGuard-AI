[project]
name = "driftguard-ai"
version = "0.1.0"
description = "Infrastructure drift detection and policy enforcement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown>=3.5",
    "mlflow>=2.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "scikit-learn>=1.3",
    "typer>=0.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "ml*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
